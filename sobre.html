<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Consoles | Console Vault</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo">CONSOLE<span>VAULT</span></div>
        <nav>
            <a href="index.html">VOLTAR AO INÍCIO</a>
        </nav>
    </header>

    <!-- Conteúdo Principal -->
    <main style="padding: 50px 8%;">
        <h1 style="color: var(--tuf-yellow); font-family: 'Orbitron', sans-serif;">CATÁLOGO DE CONSOLES</h1>
        <p style="color: var(--text-muted); margin-top: 10px;">Clique no console para expandir e ver as especificações táticas.</p>
        
        <!-- Grid de Consoles em Lado a Lado -->
        <section class="features" style="margin-top: 40px;">

            <!-- 1. NINTENDO SWITCH -->
            <input type="checkbox" id="switch" class="card-toggle">
            <label for="switch" class="card card-interactive">
                <img src="nintendo.png" alt="Nintendo Switch" class="console-img">
                <h3>NINTENDO SWITCH</h3>
                <span class="click-hint">▲ Clique para detalhar</span>
                <div class="card-details">
                    <p><strong>Exclusivos:</strong> Zelda: Tears of the Kingdom, Super Mario Odyssey, Pokémon.</p>
                    <p><strong>Detalhes:</strong> Console híbrido que permite jogar tanto na TV quanto em modo portátil.</p>
                </div>
            </label>  

            <!-- 2. PLAYSTATION 5 -->
            <input type="checkbox" id="ps5" class="card-toggle">
            <label for="ps5" class="card card-interactive">
                <img src="PS5.png" alt="PlayStation 5" class="console-img">
                <h3>PLAYSTATION 5</h3>
                <span class="click-hint">▲ Clique para detalhar</span>
                <div class="card-details">
                    <p><strong>Exclusivos:</strong> God of War Ragnarök, Marvel's Spider-Man 2, Demon's Souls.</p>
                    <p><strong>Detalhes:</strong> Foco em gráficos de nova geração com Ray Tracing e SSD ultra-rápido.</p>
                </div>
            </label>

            <!-- 3. XBOX SERIES X -->
            <input type="checkbox" id="xbox" class="card-toggle">
            <label for="xbox" class="card card-interactive">
                <img src="xbox.png" alt="Xbox Series X" class="console-img">
                <h3>XBOX SERIES X</h3>
                <span class="click-hint">▲ Clique para detalhar</span>
                <div class="card-details">
                    <p><strong>Exclusivos:</strong> Halo Infinite, Forza Horizon 5, Starfield.</p>
                    <p><strong>Detalhes:</strong> O console mais poderoso da Microsoft com 12 TFLOPS e suporte a Game Pass.</p>
                </div>
            </label>

        </section>
    </main>

</body>
</html>
